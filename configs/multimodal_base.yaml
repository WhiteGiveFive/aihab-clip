root_path: './'
dataset: 'cs'
seed: 1
shots: 0
subset_l3: []

clip_backend: 'openclip'
open_clip_model: 'hf-hub:timm/ViT-SO400M-16-SigLIP2-384'
open_clip_pretrained: null
open_clip_cache_dir: null

data:
  batch_size: 16
  shuffle: True
  num_workers: 0
  data_split:
    valid_split: 0.01
    split_seed: 42
  preprocessing:
    resize: 439
    resolution: 224
    augmentations:
      crop: ratio
      bottom_crop: False
      random_crop: True
      flip: False
      rotation: True

multimodal:
  image_feature_source: 'habitat_finetuned'
  image_checkpoint: './model_ckpt/hf-hub_timm_ViT-SO400M-16-SigLIP2-384_5_20260203_17.pt'
  geo_embeddings_path: './data/cs_geo_gse_10km/CS_Xplots_embeddings_per_file.parquet'
  output_dir: './multimodal_artifacts'
  export_image_embeddings: True
  build_joined_tables: True
  train_classifier: True
  normalize_image_embeddings: True
  embedding_batch_size: 32
  embedding_num_workers: 0
  fusion_mode: 'raw_concat'
  hidden_dim: 256
  dropout: 0.1
  train_batch_size: 128
  train_num_workers: 0
  train_epoch: 50
  train_on_train_val: False
  early_stopping: True
  patience: 10
  report_test_each_epoch: True
  print_epoch_metrics: True
  lr: 0.001
  weight_decay: 0.0001
  max_samples_per_split: null
