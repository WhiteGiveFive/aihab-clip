# Prepared template; comparative training requires a separate launch.
# M3J seed-3 geo-only completion; one shared reference, no image encoder.
schema_version: 1
study_id: attention_fusion_joint_geo_only_seed3_direct_v1
verification_policy: direct_freeze_checks_v1
result_assurance: provisional_unresolved_memory_integrity
initialization_seed_namespace: attention_fusion_v1
base_config: configs/multimodal_attention_fusion.yaml
bypass_config: configs/multimodal_attention_fusion_cls_bypass.yaml
source_config: configs/multimodal_geo_helpfulness.yaml
paths:
