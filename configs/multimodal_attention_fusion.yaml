  retained_train_checkpoint: selected_epoch50_existing_checkpoint
  all_development_rows: 4200
  keep_same_train_partition_encoder: true
  refit_components: [adapters_if_present, fusion_if_present, classifier]
  initialization: fresh_same_seed_and_selected_recipe
  epochs: 50
  reuse_selected_learning_rate: true
  standardize_refit_on_all_development: true
  candidates: all_19_selected_candidate_geo_arms
  new_fits: 76
  compare_routes_on: separate_exploratory_test_application
