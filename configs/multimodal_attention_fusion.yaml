# A002 (2026-10-12): Preserve historical CUDA extraction numerics separately
# from strict FP32 fusion/head training.
schema_version: 1
study_id: attention_fusion_v1
method: attention_fusion
regime: frozen_cached
protocol_date: '2026-10-12'
paths:
