  final_epoch: 50
  best_order: [acc1, weighted_f1, mcc, earliest_epoch]
  epoch_zero_eligible: false
  resume_boundary: completed_epoch
  keep_latest_resume: true
  keep_final_and_best: true
  prediction_replay: bounded_exploratory_tolerance
reporting:
  checkpoint_policies: [final, best]
  selection_metrics: [acc1, weighted_f1, mcc]
  primary_contrast: [attention_two_token, projected_concat]
  supporting_anchors: [raw_concat, tokenwise_capacity, image_only]
  bootstrap_replicates: 10000
  bootstrap_seed: 20261012
  single_seed_interpretation: provisional_descriptive_only
  figures_every_epochs: 1
refit_policy:
