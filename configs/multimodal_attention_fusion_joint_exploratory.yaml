# Opt-in exploratory M3J: unresolved machine-memory errors; every result is provisional.
# Strict M3J remains the default. The scientific recipe and paired RNG namespaces are unchanged.
schema_version: 1
study_id: attention_fusion_joint_exploratory_v1
result_assurance: provisional_unresolved_memory_integrity
numerical_policy:
  mode: exploratory
  frozen_atol: 1.0e-8
  frozen_rtol: 1.0e-5
  max_frozen_changed_coordinates: 8
  max_frozen_unique_deviations: 16
  recomputed_atol: 1.0e-6
  recomputed_rtol: 1.0e-5
initialization_seed_namespace: attention_fusion_v1
base_config: configs/multimodal_attention_fusion.yaml
bypass_config: configs/multimodal_attention_fusion_cls_bypass.yaml
