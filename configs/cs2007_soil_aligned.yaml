# CS2007 image subset aligned to the soil-ukceh chemistry-model experiment.

dataset: 'cs2007_soil_aligned'
wandb_project: null

soil_aligned:
  soil_csv: '../soil-ukceh/CS2007_X_with_habs_plus_soil_attributes.csv'
  image_root: './data/CS2007_Xs_Sept2024_all'
  output_dir: './results_lr/cs2007_soil_aligned'
  rare_threshold: 20
  train_size: 0.70
  valid_size: 0.15
  test_size: 0.15
  split_seed: 42
  validate_expected_counts: True
  expected_valid_soil_rows: 3517
  expected_openclip_rows: 3514
  expected_openclip_split_rows:
    train: 2452
    valid: 539
    test: 523

clip_backend: 'openclip'
open_clip_model: 'hf-hub:timm/ViT-SO400M-16-SigLIP2-384'
open_clip_pretrained: null
open_clip_cache_dir: null
use_model_preprocess: True
use_hierarchical_prompts: True
use_descriptive_prompts: True

data:
  batch_size: 16
  shuffle: True
  num_workers: 0
  preprocessing:
    resize: 439
    resolution: 224
    augmentations:
      crop: ratio
      bottom_crop: False
      random_crop: True
      flip: False
      rotation: True

finetune:
  enabled: True
  tune_text: True
  unlocked_groups: 11
  unlocked_layers: 1
  val_interval: 10
  eval_l2: False
  l2_eval_mode: 'argmax'
  eval_only: False
  checkpoint: null
  output_dir: './results'
  require_cached_features: True
  save_model: False
  save_model_dir: './model_ckpt'
  save_optimizer: True
  save_scheduler: True
  cache_embeddings: False
  cache_embeddings_split: 'test'
  cache_embeddings_dir: './feat_cache_vis'
  cache_embeddings_normalize: True
  cache_embeddings_checkpoint: null
  track_classification: False

method: 'openclip_soil_aligned'
train_epoch: 5
lr_v: 0.00005
lambda_v: 0.1
lambda_funct_1_N: False
lambda_funct_1_N2: False
search_lr: True
feat_batch_size: 64
save_checkpoints: False
save_features: False
aug_views: 3
shots: 0
seed: 1
subset_l3: []
