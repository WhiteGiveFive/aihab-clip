  global_test_event_registry: ./multimodal_artifacts/locked_test_registry/cs/gse_100m_cleaned_test/events
identity:
  canonical_json_version: geo_helpfulness.canonical_json.v1
  hash_algorithm: sha256
  row_uid_components:
  - dataset_id
  - file_lower
  - normalized_plot_idx
  file:
    type: string
    unicode_normalization: NFC
    separator: /
    convert_backslash: true
    collapse_repeated_separators: true
    remove_dot_components: true
    case_key: casefold
    reject_absolute: true
    reject_parent_components: true
    reject_nul: true
    reject_empty: true
    require_casefold_unique: true
  plot_idx:
    type: opaque_string
    unicode_normalization: NFC
    reject_surrounding_whitespace: true
    case_sensitive: true
    reject_nul: true
    reject_empty: true
    reject_control_characters: true
development_universe:
  source_roles:
  - train
  - val
  expected_rows: 4200
  expected_plots: 1625
  require_unique_row_uid: true
  require_unique_file_lower: true
  require_one_label_per_plot: true
  require_zero_locked_test_row_overlap: true
  require_zero_locked_test_plot_overlap: true
  allowed_image_sources:
  - ./data/CS_Xplots_2019_2023_train
  image_path_resolution: join_allowed_image_source_and_canonical_file
  require_image_path_inside_declared_source: true
  require_all_image_files_exist: true
  fingerprint_raw_image_bytes: true
  source_columns:
    file: file
    plot_idx: plot_idx
    source_split: split
    image_source: image_source
    label_name: label_name
locked_test_identity:
  snapshot_policy: create_once_global_active_snapshot
  source_projection_allowlist:
  - file
  - plot_idx
  expected_rows: 1347
  expected_plots: 531
  manifest_fields:
  - schema_version
  - artifact_role
  - dataset_id
  - snapshot_id
  - canonical_json_version
  - identity_rules
  - identity_projection_columns
  - identity_projection_sha256
  - row_count
  - plot_count
  - rows
  - manifest_sha256
  row_fields:
  - row_uid
  - file
  - file_lower
  - plot_idx
  - normalized_plot_idx
  forbidden_source_columns:
  - label_id
  - label_id_original
  - label_name
  - l2_label
  - target_id
  - y_true
  - logits
  - probabilities
  - image_embedding
  - geo_embedding
