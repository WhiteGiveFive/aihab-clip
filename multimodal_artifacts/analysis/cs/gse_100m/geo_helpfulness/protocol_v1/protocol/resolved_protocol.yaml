schema_version: geo_helpfulness_protocol_config_v1
protocol_id: protocol_v1
protocol_status: frozen
dataset_id: cs_gse_100m_l3
evidence_status: exploratory_router_development
paths:
  development_source_tables:
  - ./multimodal_artifacts/joined_tables/cs/hf-hub_timm_ViT-SO400M-16-SigLIP2-384_pretrained/gse_100m/seed1/train.parquet
  - ./multimodal_artifacts/joined_tables/cs/hf-hub_timm_ViT-SO400M-16-SigLIP2-384_pretrained/gse_100m/seed1/val.parquet
  locked_test_registry_root: ./multimodal_artifacts/locked_test_registry/cs/gse_100m_cleaned_test
